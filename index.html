  :root{
    --bg:#0c1a13; --panel:#10241a; --card:#132c20; --line:#1f4733;
    --field:#163a29; --field-line:#2d7a52; --field-focus:#4ade80;
    --text:#e6f4ec; --muted:#8fb8a2; --accent:#22c55e; --accent-2:#15803d;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:16px;line-height:1.5}
  .app{max-width:1200px;margin:0 auto;padding:24px 20px 40px;display:grid;grid-template-columns:380px minmax(0,1fr);gap:28px;align-items:start}
  .panel{order:1}.preview{order:2}
  @media (max-width:900px){
    .app{grid-template-columns:1fr;padding:0 14px 32px;gap:14px}
    .preview{order:0}.panel{order:1}
  }

  .preview{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
  @media (max-width:900px){
    .preview{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
      margin:0 -14px;padding:10px 14px 8px;box-shadow:0 8px 16px -8px rgba(0,0,0,.6)}
    .stage{width:min(100%,44vh);margin:0 auto}
    .hint{text-align:center;font-size:12px;margin-top:6px}
    .panel h1{font-size:19px;margin-top:4px}
  }
  .stage{position:relative;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
  canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}
  .hint{margin:10px 2px 0;color:var(--muted);font-size:14px}

  .panel h1{margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid var(--line);
    font-size:22px;font-weight:700;color:#86efac;display:flex;gap:10px;align-items:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
  .card > label:not(.drop), .card .lbl{display:block;color:var(--muted);font-size:15px;margin-bottom:8px}
  input[type=text]{width:100%;background:var(--field);border:1.5px solid var(--field-line);border-radius:10px;
    color:var(--text);font:inherit;font-size:20px;font-weight:600;padding:12px 14px;text-align:center;outline:none}
  input[type=text]:focus{border-color:var(--field-focus);box-shadow:0 0 0 3px rgba(74,222,128,.18)}
  .row{display:flex;align-items:center;gap:12px;margin-top:14px}
  .row span{color:var(--muted);font-size:14px;min-width:66px}
  .row output{color:var(--text);font-size:14px;min-width:44px;text-align:right}
  input[type=range]{flex:1;accent-color:var(--accent)}

  .drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    background:var(--field);border:1.5px dashed var(--field-line);border-radius:10px;padding:20px 12px;
    cursor:pointer;text-align:center;color:var(--muted);font-size:14px}
  .drop strong{color:var(--text);font-size:17px;font-weight:600}
  .drop:hover,.drop.over{border-color:var(--field-focus);background:#1a4430}
  .drop:focus-within{border-color:var(--field-focus)}
  .drop input{position:absolute;width:1px;height:1px;opacity:0}
  .btn-sm{background:transparent;border:1.5px solid var(--field-line);color:var(--text);border-radius:8px;
    padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
  .btn-sm:hover{border-color:var(--field-focus)}
  .btn-main{width:100%;border:0;border-radius:14px;padding:18px;font:inherit;font-size:20px;font-weight:700;color:#052e16;
    background:linear-gradient(180deg,#4ade80,#16a34a);cursor:pointer;box-shadow:0 6px 18px rgba(34,197,94,.25)}
  .btn-main:hover{filter:brightness(1.06)}
  .btn-main:active{transform:translateY(1px)}
  button:focus-visible,input:focus-visible{outline:2px solid #bbf7d0;outline-offset:2px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:#14532d;color:#dcfce7;border:1px solid #22c55e;padding:10px 18px;border-radius:10px;font-size:15px;
    opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <section class="preview">
    <div class="stage"><canvas id="cv" width="2000" height="2000" aria-label="ตัวอย่างภาพ"></canvas></div>
    <p class="hint">ลากบนภาพเพื่อเลื่อนรูป · ไฟล์ที่ได้ขนาด 2000×2000 px</p>
  </section>

  <section class="panel">
    <h1>🍀 สร้างภาพประกาศผู้โชคดี</h1>

    <div class="card">
      <label for="t1">ข้อความด้านบน</label>
      <input type="text" id="t1" value="ผู้โชคดี จ.สมุทรสาคร" autocomplete="off">
      <div class="row"><span>ขนาด</span><input type="range" id="s1" min="60" max="130" value="100"><output id="o1">100%</output></div>
    </div>

    <div class="card">
      <label for="t2">ข้อความด้านล่าง</label>
      <input type="text" id="t2" value="คันที่ 1,364" autocomplete="off">
      <div class="row"><span>ขนาด</span><input type="range" id="s2" min="60" max="130" value="100"><output id="o2">100%</output></div>
    </div>

    <div class="card">
      <span class="lbl">รูปภาพตรงกลาง</span>
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/*">
        <strong>📷 เลือกรูปภาพ</strong>
        <span id="fname">หรือลากไฟล์มาวางตรงนี้</span>
      </label>
      <div class="row"><span>ซูม</span><input type="range" id="zoom" min="100" max="300" value="100"><output id="oz">100%</output></div>
      <div class="row"><span>ซ้าย-ขวา</span><input type="range" id="panx" min="-100" max="100" value="0" aria-label="เลื่อนรูปซ้าย-ขวา"><output id="opx">0</output></div>
      <div class="row"><span>ขึ้น-ลง</span><input type="range" id="pany" min="-100" max="100" value="0" aria-label="เลื่อนรูปขึ้น-ลง"><output id="opy">0</output></div>
      <div class="row"><span>ความสว่าง</span><input type="range" id="bright" min="-60" max="60" value="0" aria-label="ความสว่างของรูป"><output id="ob">0</output></div>
      <div class="row" style="justify-content:flex-end"><button class="btn-sm" id="reset" type="button">รีเซ็ตรูป</button></div>
    </div>

    <button class="btn-main" id="dl" type="button">✨ ดาวน์โหลดภาพ</button>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 2000, H = 2000;
// พื้นที่สีขาวในพื้นหลัง (สำหรับวางรูป)
const AREA = [[0,375],[2000,190],[2000,1791],[0,1984]];
const ANGLE = Math.atan2(185-370, 2000); // ≈ -5.3°
const FONT = '"DB Impacto X It", "Leelawadee UI", Tahoma, sans-serif';

const state = { photo:null, src:null, zoom:1, ox:0, oy:0, bright:0 };

// เก็บต้นฉบับไว้ แล้วสร้างสำเนาที่ปรับความสว่าง (ใช้ได้ทุกเบราว์เซอร์ รวม Safari บนมือถือ)
function prepareSource(img){
  const MAX = 2400, s = Math.min(1, MAX/Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  state.src = c;
  state.srcData = c.getContext('2d').getImageData(0,0,c.width,c.height);
  state.photo = document.createElement('canvas');
  state.photo.width = c.width; state.photo.height = c.height;
  applyBrightness();
}
function applyBrightness(){
  if (!state.src) return;
  const out = state.photo.getContext('2d');
  if (state.bright === 0){ out.putImageData(state.srcData,0,0); return; }
  const src = state.srcData.data, img = out.createImageData(state.src.width, state.src.height), d = img.data;
  const k = 1 + state.bright/100;
  for (let i=0;i<src.length;i+=4){
    d[i]=src[i]*k; d[i+1]=src[i+1]*k; d[i+2]=src[i+2]*k; d[i+3]=src[i+3];
  }
  out.putImageData(img,0,0);
}
let brightRaf = 0;
const bg = new Image();
const $ = id => document.getElementById(id);

function clipArea(){
  ctx.beginPath();
  AREA.forEach(([x,y],i)=> i? ctx.lineTo(x,y): ctx.moveTo(x,y));
  ctx.closePath();
}

// ขนาดรูปแบบ cover ให้เต็มกรอบ
function photoRect(){
  const p = state.photo, bx=0, by=185, bw=2000, bh=1989-185;
  const s = Math.max(bw/p.width, bh/p.height) * state.zoom;
  const w = p.width*s, h = p.height*s;
  return { x: bx + (bw-w)/2 + state.ox, y: by + (bh-h)/2 + state.oy, w, h };
}

// คำนวณขนาดข้อความ (ย่ออัตโนมัติเมื่อยาวเกินกรอบ)
function fitText(t){
  ctx.save(); ctx.font = `${t.size}px ${FONT}`;
  const w = ctx.measureText(t.text).width; ctx.restore();
  if (w > t.maxW){ const r = t.maxW/w; return {...t, size:t.size*r, k:t.k*r}; }
  return t;
}
function pathText(c, t, dx, dy, scale){
  c.save();
  c.scale(scale, scale);
  c.translate(t.x + dx, t.y + dy);
  c.rotate(t.angle*Math.PI/180);
  c.font = `${t.size}px ${FONT}`;
  c.textAlign = t.align; c.textBaseline = 'alphabetic';
  c.lineJoin = 'round'; c.miterLimit = 2;
}
// เงา: วาดลงแคนวาสเล็กแล้วเบลอเอง ให้ผลเหมือนกันทุกเบราว์เซอร์และทุกครั้งที่วาด
const SH_SCALE = 0.25, shCv = document.createElement('canvas');
shCv.width = W*SH_SCALE; shCv.height = H*SH_SCALE;
const shCtx = shCv.getContext('2d', { willReadFrequently:true });
function boxBlurAlpha(img, w, h, r){
  const a = new Float32Array(w*h), b = new Float32Array(w*h);
  for (let i=0;i<w*h;i++) a[i] = img.data[i*4+3];
  const pass = (src, dst, horiz) => {
    const n = horiz ? w : h, m = horiz ? h : w, d = 2*r+1;
    for (let j=0;j<m;j++){
      let sum = 0;
      const idx = i => horiz ? j*w + i : i*w + j;
      for (let i=-r;i<=r;i++) sum += src[idx(Math.min(n-1,Math.max(0,i)))];
      for (let i=0;i<n;i++){
        dst[idx(i)] = sum/d;
        sum += src[idx(Math.min(n-1,i+r+1))] - src[idx(Math.max(0,i-r))];
      }
    }
  };
  for (let p=0;p<3;p++){ pass(a,b,true); pass(b,a,false); }
  for (let i=0;i<w*h;i++){ img.data[i*4]=20; img.data[i*4+1]=18; img.data[i*4+2]=18; img.data[i*4+3]=a[i]; }
  return img;
}
function drawTexts(list){
  // 1) เงา
  shCtx.setTransform(1,0,0,1,0,0);
  shCtx.clearRect(0,0,shCv.width,shCv.height);
  for (const t of list){
    pathText(shCtx, t, 9*t.k, 3*t.k, SH_SCALE);
    shCtx.strokeStyle = '#000'; shCtx.lineWidth = 20*t.k; shCtx.fillStyle = '#000';
    shCtx.strokeText(t.text,0,0); shCtx.fillText(t.text,0,0);
    shCtx.restore();
  }
  const img = boxBlurAlpha(shCtx.getImageData(0,0,shCv.width,shCv.height), shCv.width, shCv.height, 2);
  shCtx.putImageData(img,0,0);
  ctx.save(); ctx.globalAlpha = 0.45; ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(shCv, 0, 0, W, H); ctx.restore();
  // 2) ขอบแดง + ตัวอักษรขาว
  for (const t of list){
    pathText(ctx, t, 0, 0, 1);
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ed1e24'; ctx.lineWidth = 20*t.k;
    ctx.strokeText(t.text,0,0);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(t.text,0,0);
    ctx.restore();
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  if (bg.complete && bg.naturalWidth) ctx.drawImage(bg,0,0,W,H);

  ctx.save(); clipArea(); ctx.clip();
  if (state.photo){
    const r = photoRect();
    ctx.drawImage(state.photo, r.x, r.y, r.w, r.h);
  } else {
    ctx.fillStyle = '#eef3f0'; ctx.fill();
    ctx.translate(1000,1090); ctx.rotate(ANGLE);
    ctx.fillStyle = '#9fb3a8'; ctx.textAlign='center';
    ctx.font = `600 64px "IBM Plex Sans Thai", Tahoma, sans-serif`;
    ctx.fillText('อัปโหลดรูปภาพตรงนี้', 0, 0);
  }
  ctx.restore();

  const k1 = +$('s1').value/100, k2 = +$('s2').value/100;
  drawTexts([
    fitText({ text:$('t1').value, x:50,   y:293,  size:268*k1, angle:-5.35, align:'left',  maxW:1890, k:k1 }),
    fitText({ text:$('t2').value, x:1877, y:1835, size:317*k2, angle:-5.2,  align:'right', maxW:1820, k:k2 })
  ]);
}

// ---------- รูปภาพ ----------
function loadFile(f){
  if (!f || !f.type.startsWith('image/')){ toast('ไฟล์นี้ไม่ใช่รูปภาพ ลองเลือกไฟล์ .jpg หรือ .png'); return; }
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => { prepareSource(img); URL.revokeObjectURL(url); resetPhoto(); $('fname').textContent = f.name; };
  img.onerror = () => toast('เปิดรูปนี้ไม่ได้ ลองใช้ไฟล์อื่น');
  img.src = url;
}
function resetPhoto(){ state.zoom=1; state.ox=0; state.oy=0; $('zoom').value=100; $('oz').textContent='100%';
  $('panx').value=0; $('opx').textContent='0'; $('pany').value=0; $('opy').textContent='0';
  state.bright=0; $('bright').value=0; $('ob').textContent='0'; applyBrightness(); render(); }
$('bright').addEventListener('input', e => {
  state.bright = +e.target.value; $('ob').textContent = (state.bright>0?'+':'')+state.bright;
  cancelAnimationFrame(brightRaf); brightRaf = requestAnimationFrame(()=>{ applyBrightness(); render(); });
});

$('file').addEventListener('change', e => loadFile(e.target.files[0]));
const drop = $('drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
// วางไฟล์บนภาพตัวอย่างได้ด้วย
cv.addEventListener('dragover', e=>e.preventDefault());
cv.addEventListener('drop', e=>{e.preventDefault(); loadFile(e.dataTransfer.files[0]);});

$('zoom').addEventListener('input', e => { state.zoom = e.target.value/100; $('oz').textContent = e.target.value+'%'; clampPan(); render(); });
$('reset').addEventListener('click', resetPhoto);

// ระยะที่เลื่อนได้: ส่วนที่ล้นกรอบ + อีกครึ่งหนึ่งของกรอบ (เลื่อนได้แม้รูปพอดีกรอบ)
function panLimits(){
  const p=state.photo, s=Math.max(2000/p.width,1804/p.height)*state.zoom;
  return { mx: Math.max(0,(p.width*s-2000)/2) + 1000, my: Math.max(0,(p.height*s-1804)/2) + 900 };
}
function clampPan(){
  if (!state.photo) return;
  const {mx,my} = panLimits();
  state.ox=Math.max(-mx,Math.min(mx,state.ox)); state.oy=Math.max(-my,Math.min(my,state.oy));
  syncPanSliders();
}
function syncPanSliders(){
  if (!state.photo) return;
  const {mx,my} = panLimits();
  const vx = Math.round(state.ox/mx*100), vy = Math.round(state.oy/my*100);
  $('panx').value = vx; $('opx').textContent = vx;
  $('pany').value = vy; $('opy').textContent = vy;
}
$('panx').addEventListener('input', e=>{ if(!state.photo) return; state.ox = e.target.value/100*panLimits().mx; $('opx').textContent=e.target.value; render(); });
$('pany').addEventListener('input', e=>{ if(!state.photo) return; state.oy = e.target.value/100*panLimits().my; $('opy').textContent=e.target.value; render(); });
let drag=null;
cv.addEventListener('pointerdown', e=>{ if(!state.photo) { $('file').click(); return; }
  drag={x:e.clientX,y:e.clientY,ox:state.ox,oy:state.oy}; cv.setPointerCapture(e.pointerId); cv.classList.add('dragging'); });
cv.addEventListener('pointermove', e=>{ if(!drag) return;
  const k = W / cv.getBoundingClientRect().width;
  state.ox = drag.ox + (e.clientX-drag.x)*k; state.oy = drag.oy + (e.clientY-drag.y)*k; clampPan(); render(); });
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{drag=null;cv.classList.remove('dragging')}));
cv.addEventListener('wheel', e=>{ if(!state.photo) return; e.preventDefault();
  const z = Math.max(100,Math.min(300, +$('zoom').value - Math.sign(e.deltaY)*5));
  $('zoom').value=z; $('zoom').dispatchEvent(new Event('input')); }, {passive:false});

// ---------- ข้อความ ----------
['t1','t2'].forEach(id=>$(id).addEventListener('input',render));
[['s1','o1'],['s2','o2']].forEach(([s,o])=>$(s).addEventListener('input',e=>{$(o).textContent=e.target.value+'%';render();}));

// ---------- ดาวน์โหลด ----------
$('dl').addEventListener('click', ()=>{
  cv.toBlob(b=>{
    const a=document.createElement('a');
    const name = ($('t1').value+' '+$('t2').value).trim().replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'_') || 'image';
    a.href=URL.createObjectURL(b); a.download=name+'.jpg';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('ดาวน์โหลดภาพแล้ว');
  },'image/jpeg',0.92);
});

let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }

// ---------- เริ่มต้น ----------
bg.onload = render;
bg.src = BG_SRC;
Promise.all([
  document.fonts.load(`100px "DB Impacto X It"`, 'ผู้โชคดี 1,364'),
  document.fonts.load(`600 64px "IBM Plex Sans Thai"`, 'อัปโหลด')
]).catch(()=>{}).finally(render);
render();
</script>
</body>
</html>
